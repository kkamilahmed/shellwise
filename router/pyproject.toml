[project]
name = "shellwise-router"
version = "0.1.0"
description = "Two-stage tool router for shellwise: Laya picks a bucket, then a tool within it"
requires-python = ">=3.11,<3.13"
dependencies = [
    "laya>=0.4",
    # Declared directly so the Windows CUDA source below applies to it.
    "torch>=2.4",
]

[project.scripts]
shellwise-build-catalog = "shellwise_router.build_catalog:main"
shellwise-route = "shellwise_router.cli:main"
shellwise-eval-router = "shellwise_router.evaluate:main"
shellwise-build-router-data = "shellwise_router.build_finetune_data:main"
shellwise-finetune-router = "shellwise_router.finetune:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shellwise_router"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyPI's Windows wheels for torch are CPU-only. On Windows, take the CUDA 13
# build from PyTorch's own index instead; Linux and macOS keep the PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
