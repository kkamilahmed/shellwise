[project]
name = "shellwise-train"
version = "0.1.0"
description = "Data pipeline, LoRA fine-tuning, evaluation and export for the shellwise NL-to-shell model"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "peft>=0.18",
    "accelerate>=1.0",
    "huggingface-hub>=0.25",
    "pandas>=2.2",
    "pyarrow>=17",
    "bashlex>=0.18",
    "safetensors>=0.4",
]

[project.scripts]
shellwise-build-data = "shellwise_train.build_dataset:main"
shellwise-train = "shellwise_train.train:main"
shellwise-eval = "shellwise_train.evaluate:main"
shellwise-export = "shellwise_train.export:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shellwise_train"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
